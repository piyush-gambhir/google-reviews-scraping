[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grscraper"
version = "0.2.3"
description = "Free, resumable Google Maps reviews scraper — deployable as a container"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.14"
keywords = ["google-maps", "reviews", "scraper", "playwright", "cloud-run", "lambda"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]
# Deliberately two runtime dependencies. Sinks that need a cloud SDK import it
# lazily and declare it as an extra, so the base image stays small.
dependencies = [
    "playwright>=1.63",
    "beautifulsoup4>=4.15",
]

[project.urls]
Homepage = "https://github.com/piyush-gambhir/google-reviews-scraping"
Issues = "https://github.com/piyush-gambhir/google-reviews-scraping/issues"

[project.optional-dependencies]
s3 = ["boto3>=1.43"]
gcs = ["google-cloud-storage>=3.17"]
dev = [
    "pytest>=9.1",
    "ruff>=0.17",
    "jsonschema>=4.26",
]

[project.scripts]
grscraper = "grscraper.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
