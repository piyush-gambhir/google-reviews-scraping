name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - run: pip install -e ".[dev]"

      - run: ruff check

      # No browser install: the suite is offline by design (fixture HTML, a
      # temp SQLite file, a loopback HTTP server). Nothing here touches Google.
      - run: pytest

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: grscraper:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image smoke test
        run: |
          set -euo pipefail
          docker run --rm grscraper:ci --help
          # A sync with no targets must still emit a well-formed document.
          docker run --rm -e GRS_SINKS=- grscraper:ci sync | tee /tmp/out.json
          python -m pip install --quiet jsonschema
          python - <<'PY'
          import json, jsonschema
          doc = json.load(open("/tmp/out.json"))
          jsonschema.validate(doc, json.load(open("schemas/scrape-result.v1.json")))
          assert doc["businesses"] == []
          print("image emits a schema-valid document")
          PY

  lambda-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.lambda
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
