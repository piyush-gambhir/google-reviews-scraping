name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - run: pip install -e ".[dev]"

      - run: ruff check

      # No browser install: the suite is offline by design (fixture HTML, a
      # temp SQLite file, a loopback HTTP server). Nothing here touches Google.
      - run: pytest

  docker:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: false
          load: true
          tags: grscraper:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image smoke test
        run: |
          set -euo pipefail
          docker run --rm grscraper:ci --help
          # A sync with no targets must still emit a well-formed document.
          docker run --rm -e GRS_SINKS=- grscraper:ci sync | tee /tmp/out.json
          python -m pip install --quiet jsonschema
          python - <<'PY'
          import json, jsonschema
          doc = json.load(open("/tmp/out.json"))
          jsonschema.validate(doc, json.load(open("schemas/scrape-result.v1.json")))
          assert doc["businesses"] == []
          print("image emits a schema-valid document")
          PY

  lambda-image:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: Dockerfile.lambda
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
